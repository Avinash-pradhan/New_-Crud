<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Data - School Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Fullscreen Interactive Physics Background */
        #interactiveCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto;
        }

        /* Ambient Floating Glowing Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
            animation: orbFloat 14s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 420px;
            height: 420px;
            background: #3b82f6;
            top: -120px;
            left: -120px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: #8b5cf6;
            bottom: -120px;
            right: -120px;
            animation-duration: 18s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(70px, 50px) scale(1.15); }
            100% { transform: translate(-50px, 80px) scale(0.9); }
        }

        /* Glassmorphic Form Card */
        .form-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: formEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 25px 60px rgba(37, 99, 235, 0.3);
        }

        @keyframes formEntrance {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #93c5fd, #ffffff);
            background-size: 200% auto;
            /* -webkit-background-clip: text; */
            -webkit-text-fill-color: transparent;
            animation: shineText 5s linear infinite;
            letter-spacing: -0.5px;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .form-header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 6px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            background: rgba(15, 23, 42, 0.85);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        /* Form Actions */
        .form-actions {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input[type="submit"]:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.7);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        .cancel-btn {
            display: block;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .cancel-btn:hover {
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.1);
        }
    </style>
</head>

<body>
    <!-- Interactive Canvas Particles Background -->
    <canvas id="interactiveCanvas"></canvas>

    <!-- Floating Background Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Form Container -->
    <div class="form-card tilt-card">
        <div class="form-header">
            <h1>Add Student Data</h1>
            <p>Enter academic and contact information below</p>
        </div>

        <form action="" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="student">Name:</label>
                <input type="text" name="student" id="student" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label for="number">Number:</label>
                <input type="text" name="number" id="number" placeholder="e.g. +91 9876543210" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="e.g. student@domain.com" required>
            </div>

            <div class="form-group">
                <label for="degree">Degree:</label>
                <input type="text" name="degree" id="degree" placeholder="e.g. BCA / B.Tech" required>
            </div>

            <div class="form-group">
                <label for="yop">Year of Passing:</label>
                <input type="text" name="yop" id="yop" placeholder="e.g. 2026" required>
            </div>

            <div class="form-actions">
                <input type="submit" value="Add Student">
                <a href="/" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

    <!-- Interactive Canvas & 3D Tilt Script -->
    <script>
        // 1. Interactive Physics Particle Canvas
        const canvas = document.getElementById('interactiveCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null, radius: 130 };

        function initCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvasSize();
        window.addEventListener('resize', () => {
            initCanvasSize();
            createParticles();
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class ParticleNode {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = Math.random() > 0.5 ? '#3b82f6' : '#8b5cf6';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 3.5;
                        this.y -= (dy / dist) * force * 3.5;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function createParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 10000);
            for (let i = 0; i < count; i++) {
                particles.push(new ParticleNode());
            }
        }
        createParticles();

        function renderNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(59, 130, 246, ${1 - dist / 100})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
            requestAnimationFrame(renderNetwork);
        }
        renderNetwork();

        // 2. 3D Tilt Effect on Form Card
        const card = document.querySelector('.tilt-card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `perspective(800px) rotateX(${-y * 0.03}deg) rotateY(${x * 0.03}deg) translateY(-4px)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });
    </script>
</body>
</html>
